[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
testpaths =
    apps/identity/tests
    apps/permissions/tests
    apps/audit/tests
    tests
pythonpath = .
addopts = -v --strict-markers --tb=short
markers =
    slow: marks tests as slow
    unit: unit tests
    integration: integration tests
