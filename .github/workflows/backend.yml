name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '!backend/README.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '!backend/README.md'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: edukit_test
          POSTGRES_USER: edukit
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Lint (ruff)
        run: ruff check .

      - name: Run migrations
        env:
          DATABASE_URL: postgres://edukit:test@localhost:5432/edukit_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://edukit:test@localhost:5432/edukit_test
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=. --cov-report=xml
